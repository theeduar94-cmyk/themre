<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Bicholover Favorito</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay">
        <div class="cr7-background"></div>
        <div class="gradient-overlay"></div>
    </div>

    <div class="container">
        <main class="main-content">
            <div class="central-message">
                <div class="message-container">
                    <div class="cr7-number">7</div>
                    <div class="animated-text">
                        <span class="word">PARA</span>
                        <span class="word">MI</span>
                        <span class="word">BICHOLOVER</span>
                        <span class="word">FAVORITO</span>
                    </div>
                    <div class="subtitle-message">
                        <span class="word-sub">TÚ</span>
                        <span class="word-sub">NO</span>
                        <span class="word-sub">SERÁS</span>
                        <span class="word-sub">ESPECTADOR</span>
                    </div>
                </div>
            </div>

            <div class="hot-wheels-section">
                <div class="racing-track">
                    <div class="track-line top"></div>
                    <div class="track-line bottom"></div>
                    <div class="hot-wheels-car car-red"></div>
                    <div class="hot-wheels-car car-blue"></div>
                    <div class="hot-wheels-car car-yellow"></div>
                    <div class="hot-wheels-car car-green"></div>
                    <div class="hot-wheels-car car-orange"></div>
                </div>
                
                <div class="speed-effects">
                    <div class="speed-line"></div>
                    <div class="speed-line"></div>
                    <div class="speed-line"></div>
                    <div class="speed-line"></div>
                </div>
            </div>
        </main>
        
        <div class="floating-elements">
            <div class="floating-heart"></div>
            <div class="floating-heart"></div>
            <div class="floating-heart"></div>
            <div class="floating-star">⭐</div>
            <div class="floating-star">⭐</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
